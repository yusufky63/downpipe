[package]
name = "downpipe-core"
description = "Download queue, state machine and persistence for Downpipe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chrono.workspace = true
dirs.workspace = true
downpipe-http.workspace = true
downpipe-providers.workspace = true
downpipe-torrent = { workspace = true, optional = true }
parking_lot.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[features]
# BitTorrent downloads through librqbit. Large, so off unless asked for;
# the desktop app ships with it.
torrent = ["dep:downpipe-torrent"]

[dev-dependencies]
downpipe-test-server.workspace = true
downpipe-torrent = { workspace = true, features = ["testing"] }
tempfile.workspace = true

# Runs its own `main`: the test binary doubles as the fake yt-dlp it starts
# (see downpipe_test_server::fake_tools).
[[test]]
name = "sites"
harness = false

# Runs its own `main`, which makes the manager's torrents listen on
# loopback before any thread starts.
[[test]]
name = "torrents"
harness = false
required-features = ["torrent"]

[lints]
workspace = true
