<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="options.pageTitle">Downpipe</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="page.css" />
    <link rel="stylesheet" href="options.css" />
    <script src="options.js" defer></script>
  </head>
  <body>
    <header class="head page-head">
      <div class="frame head-row">
        <img class="logo" src="icons/icon-32.png" alt="" width="20" height="20" />
        <span class="brand">Downpipe</span>
        <span class="label head-label" data-i18n="options.headLabel"></span>
      </div>
    </header>

    <form id="form" novalidate>
      <main class="frame main">
        <div class="intro">
          <h1 class="title" data-i18n="common.filters"></h1>
          <p class="lede" data-i18n="options.lede"></p>
        </div>

        <p class="notice" id="capture-off" data-i18n="options.captureOff" hidden></p>
        <p class="notice" id="load-error" data-tone="danger" role="alert" data-i18n="options.loadError" hidden></p>

        <section class="card" aria-labelledby="types-heading">
          <div class="card-head">
            <h2 class="eyebrow" id="types-heading" data-i18n="options.typesHeading"></h2>
          </div>
          <div class="card-body">
            <label class="switch-row" for="capture-all">
              <span class="switch-text">
                <span class="row-title" data-i18n="options.captureAll"></span>
                <span class="row-detail" data-i18n="options.captureAllDetail"></span>
              </span>
              <input type="checkbox" role="switch" class="switch" id="capture-all" />
            </label>
            <div class="field">
              <label class="field-label" for="types" data-i18n="options.typesLabel"></label>
              <textarea
                class="input"
                id="types"
                rows="5"
                spellcheck="false"
                autocomplete="off"
                autocapitalize="off"
                aria-describedby="types-help types-errors"
              ></textarea>
              <p class="help" id="types-help" data-i18n="options.typesHelp">
                <code class="inline" data-var="example">zip pdf mp4</code>
                <code class="inline" data-var="tarGz">tar.gz</code>
              </p>
              <ul class="errors" id="types-errors" aria-live="polite"></ul>
              <div class="field-actions">
                <button type="button" class="link" id="types-default" data-i18n="options.restoreDefault"></button>
              </div>
            </div>
          </div>
        </section>

        <section class="card" aria-labelledby="sites-heading">
          <div class="card-head">
            <h2 class="eyebrow" id="sites-heading" data-i18n="options.sitesHeading"></h2>
          </div>
          <div class="card-body">
            <div class="field">
              <label class="field-label" for="sites" data-i18n="options.sitesLabel"></label>
              <textarea
                class="input"
                id="sites"
                rows="5"
                spellcheck="false"
                autocomplete="off"
                autocapitalize="off"
                placeholder="example.com&#10;*.example.org"
                aria-describedby="sites-help sites-errors"
              ></textarea>
              <p class="help" id="sites-help" data-i18n="options.sitesHelp">
                <code class="inline" data-var="wildcard">*.example.org</code>
              </p>
              <ul class="errors" id="sites-errors" aria-live="polite"></ul>
            </div>
          </div>
        </section>

        <section class="card" aria-labelledby="size-heading">
          <div class="card-head">
            <h2 class="eyebrow" id="size-heading" data-i18n="options.sizeHeading"></h2>
          </div>
          <div class="card-body">
            <div class="field">
              <label class="field-label" for="size" data-i18n="options.sizeLabel"></label>
              <div class="size-row">
                <input
                  class="input num"
                  id="size"
                  type="text"
                  inputmode="decimal"
                  autocomplete="off"
                  aria-describedby="size-help size-errors"
                />
                <select class="input" id="unit" data-i18n-aria-label="common.unit">
                  <option value="KiB">KiB</option>
                  <option value="MiB">MiB</option>
                </select>
              </div>
              <p class="help" id="size-help" data-i18n="options.sizeHelp"></p>
              <ul class="errors" id="size-errors" aria-live="polite"></ul>
            </div>
          </div>
        </section>

        <section class="card" aria-labelledby="media-heading">
          <div class="card-head">
            <h2 class="eyebrow" id="media-heading" data-i18n="options.mediaHeading"></h2>
          </div>
          <div class="card-body">
            <p class="help" data-i18n="options.mediaHelp"></p>
            <label class="switch-row" for="media-overlay">
              <span class="switch-text">
                <span class="row-title" data-i18n="options.overlay"></span>
                <span class="row-detail" data-i18n="options.overlayDetail"></span>
              </span>
              <input type="checkbox" role="switch" class="switch" id="media-overlay" />
            </label>
            <div class="field">
              <label class="field-label" for="media-types" data-i18n="options.mediaTypesLabel"></label>
              <textarea
                class="input"
                id="media-types"
                rows="3"
                spellcheck="false"
                autocomplete="off"
                autocapitalize="off"
                aria-describedby="media-types-help media-types-errors"
              ></textarea>
              <p class="help" id="media-types-help" data-i18n="options.mediaTypesHelp"></p>
              <ul class="errors" id="media-types-errors" aria-live="polite"></ul>
              <div class="field-actions">
                <button type="button" class="link" id="media-types-default" data-i18n="options.restoreDefault"></button>
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="media-size" data-i18n="options.mediaSizeLabel"></label>
              <div class="size-row">
                <input
                  class="input num"
                  id="media-size"
                  type="text"
                  inputmode="decimal"
                  autocomplete="off"
                  aria-describedby="media-size-help media-size-errors"
                />
                <select class="input" id="media-unit" data-i18n-aria-label="common.unit">
                  <option value="KiB">KiB</option>
                  <option value="MiB">MiB</option>
                </select>
              </div>
              <p class="help" id="media-size-help" data-i18n="options.mediaSizeHelp"></p>
              <ul class="errors" id="media-size-errors" aria-live="polite"></ul>
            </div>
          </div>
        </section>

        <section class="card" aria-labelledby="bypass-heading">
          <div class="card-head">
            <h2 class="eyebrow" id="bypass-heading" data-i18n="options.bypassHeading"></h2>
          </div>
          <div class="card-body">
            <div class="field">
              <label class="field-label" for="bypass-key" data-i18n="options.bypassLabel"></label>
              <select class="input" id="bypass-key" aria-describedby="bypass-help">
                <option value="alt" data-i18n="options.bypassAlt"></option>
                <option value="shift" data-i18n="options.bypassShift"></option>
                <option value="off" data-i18n="options.bypassOff"></option>
              </select>
              <p class="help" id="bypass-help" data-i18n="options.bypassHelp"></p>
            </div>
            <div class="notice" id="bypass-access" hidden>
              <span data-i18n="options.bypassAccess"></span>
              <div class="field-actions">
                <button type="button" class="link" id="bypass-allow" data-i18n="options.bypassAllow"></button>
              </div>
            </div>
          </div>
        </section>
      </main>

      <div class="dock">
        <div class="frame dock-row">
          <p class="dock-note" id="save-state" role="status" aria-live="polite"></p>
          <div class="dock-actions">
            <button type="submit" class="btn btn-primary" id="save" data-i18n="options.save"></button>
          </div>
        </div>
      </div>
    </form>
  </body>
</html>
