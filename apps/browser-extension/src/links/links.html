<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Links · Downpipe</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="page.css" />
    <link rel="stylesheet" href="links.css" />
    <script src="links.js" defer></script>
  </head>
  <body>
    <header class="head page-head">
      <div class="frame head-row">
        <img class="logo" src="icons/icon-32.png" alt="" width="20" height="20" />
        <span class="brand">Downpipe</span>
        <span class="label head-label">Links on a page</span>
      </div>
    </header>

    <main class="frame main">
      <div class="intro">
        <h1 class="title" id="title">Links on this page</h1>
        <p class="page-url" id="page-url" hidden></p>
        <p class="lede" id="found" hidden></p>
      </div>

      <div class="bridge" id="bridge" hidden>
        <div class="status" id="status" data-tone="muted" role="status" aria-live="polite">
          <span class="dot" aria-hidden="true"></span>
          <div class="status-text">
            <p class="status-title" id="status-title">Checking the connection</p>
            <p class="status-detail" id="status-detail" hidden></p>
            <code class="command" id="status-command" hidden></code>
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn" id="recheck">Check again</button>
          <a
            class="link"
            id="guide"
            href="https://github.com/yusufky63/downpipe/blob/main/docs/BROWSER_BRIDGE.md"
            target="_blank"
            rel="noopener noreferrer"
            hidden
            >Setup guide</a
          >
        </div>
      </div>

      <p class="notice" id="notice" data-tone="muted" hidden></p>

      <section class="card" id="picker" aria-label="Links" hidden>
        <div class="tools">
          <input
            class="input"
            id="query"
            type="search"
            placeholder="Filter by text or address"
            aria-label="Filter links by text or address"
            autocomplete="off"
            spellcheck="false"
          />
          <label class="switch-row tools-switch" for="hide-pages">
            <span class="row-title">Hide web pages</span>
            <input type="checkbox" role="switch" class="switch" id="hide-pages" checked />
          </label>
        </div>
        <div class="chips" id="chips" role="group" aria-label="File types"></div>
        <div class="list-head">
          <div class="select-actions">
            <button type="button" class="link" id="select-all">Select all</button>
            <button type="button" class="link" id="select-none">Select none</button>
          </div>
          <span class="label num" id="count"></span>
        </div>
        <ul class="rows" id="rows"></ul>
        <p class="empty" id="empty" hidden></p>
      </section>
    </main>

    <div class="dock" id="dock" hidden>
      <div class="frame dock-row">
        <p class="dock-note" id="summary" role="status" aria-live="polite"></p>
        <div class="dock-actions">
          <button type="button" class="btn" id="stop" hidden>Stop</button>
          <button type="button" class="btn btn-primary" id="download" disabled>Download 0 links</button>
        </div>
      </div>
    </div>
  </body>
</html>
