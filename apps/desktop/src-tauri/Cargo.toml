[package]
name = "downpipe-desktop"
description = "Downpipe desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
# BitTorrent ships in the app (see crates/core, feature `torrent`).
downpipe-core = { workspace = true, features = ["torrent"] }
downpipe-native-host.workspace = true
downpipe-remote.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
arboard = { version = "=3.6.1", default-features = false }
chrono.workspace = true
drag = "2.1.1"
tauri-plugin-autostart = "2.7.0"
keepawake = "0.6.1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
sys-locale = "0.3.2"
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# X11 is always built in, but through XWayland it sees what other programs
# copy only while one of its windows has the focus. The data-control protocol
# (KDE, wlroots compositors) lets the watcher read the Wayland clipboard
# directly; arboard falls back to X11 where the compositor lacks it.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }

[lints]
workspace = true
